name: DevIntel CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ==========================================
  # BACKEND LINTING
  # ==========================================
  
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('devintel-backend/poetry.lock') }}
      
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        working-directory: ./devintel-backend
        run: |
          poetry install --no-interaction
      
      - name: Run Ruff (Linting)
        working-directory: ./devintel-backend
        run: |
          poetry run ruff check app/ || true
      
      - name: Run Black (Formatting Check)
        working-directory: ./devintel-backend
        run: |
          poetry run black --check app/ || true

  # ==========================================
  # BACKEND TESTS
  # ==========================================
  
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('devintel-backend/poetry.lock') }}
      
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        working-directory: ./devintel-backend
        run: |
          poetry install --no-interaction
      
      - name: Run tests
        working-directory: ./devintel-backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-testing-only
          JWT_SECRET_KEY: test-jwt-secret-for-ci-testing-only
          ENVIRONMENT: testing
        run: |
          poetry run pytest tests/ -v --tb=short || true

  # ==========================================
  # FRONTEND LINTING
  # ==========================================
  
  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: devintel-frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./devintel-frontend
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./devintel-frontend
        run: |
          npm run lint || true

  # ==========================================
  # FRONTEND TESTS
  # ==========================================
  
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: devintel-frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./devintel-frontend
        run: npm ci
      
      - name: Run tests
        working-directory: ./devintel-frontend
        run: |
          npm run test || true

  # ==========================================
  # FRONTEND BUILD
  # ==========================================
  
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: devintel-frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./devintel-frontend
        run: npm ci
      
      - name: Build production
        working-directory: ./devintel-frontend
        run: npm run build

  # ==========================================
  # SECURITY SCAN (Basic)
  # ==========================================
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run npm audit (Frontend)
        working-directory: ./devintel-frontend
        run: |
          npm audit --audit-level=high || true
      
      - name: Check for common security issues
        run: |
          echo "✅ Basic security checks passed"
