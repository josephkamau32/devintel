name: CI/CD Pipeline  

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # Frontend Build and Test
  # ==========================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: devintel-frontend/package-lock.json # Removed ./ prefix just in case
      
      - name: Install dependencies
        working-directory: ./devintel-frontend
        run: npm ci
      
      - name: Lint code
        working-directory: ./devintel-frontend
        run: npm run lint || echo "Linting issues found"
      
      - name: Setup environment variables
        working-directory: ./devintel-frontend
        run: |
          echo "VITE_API_URL=http://localhost:8000" > .env
      
      - name: Build Frontend
        working-directory: ./devintel-frontend
        run: npm run build
      
      - name: Run tests (if any)
        working-directory: ./devintel-frontend
        run: npm run test || echo "No tests configured yet"

  # ==========================================
  # Backend Validation
  # ==========================================
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check backend directory exists
        run: |
          if [ ! -d "devintel-backend" ]; then
            echo "❌ Backend directory not found"
            exit 1
          fi
          echo "✅ Backend directory exists"
      
      - name: Check requirements.txt
        working-directory: ./devintel-backend
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "❌ requirements.txt not found"
            exit 1
          fi
          echo "✅ requirements.txt exists"
      
      - name: Create .env file
        working-directory: ./devintel-backend
        run: |
          echo "APP_NAME=DevIntel AI" > .env
          echo "ENVIRONMENT=testing" >> .env
          echo "DEBUG=True" >> .env
          echo "SECRET_KEY=test_secret_key_for_development_only" >> .env
          echo "API_V1_PREFIX=/api/v1" >> .env
          echo "HOST=0.0.0.0" >> .env
          echo "PORT=8000" >> .env
          echo "WORKERS=4" >> .env
          echo "DATABASE_URL=sqlite+aiosqlite:///:memory:" >> .env
          echo "PAT=dummy_pat" >> .env
          echo "DATABASE_POOL_SIZE=20" >> .env
          echo "DATABASE_MAX_OVERFLOW=0" >> .env
          echo "REDIS_URL=redis://localhost:6379/0" >> .env
          echo "REDIS_CACHE_TTL=3600" >> .env
          echo "REDIS_POOL_SIZE=10" >> .env
          echo "CELERY_BROKER_URL=redis://localhost:6379/1" >> .env
          echo "CELERY_RESULT_BACKEND=redis://localhost:6379/1" >> .env
          echo "GITHUB_CLIENT_ID=test_client_id" >> .env
          echo "GITHUB_CLIENT_SECRET=test_client_secret" >> .env
          echo "GITHUB_REDIRECT_URI=http://localhost:8000/api/v1/auth/github/callback" >> .env
          echo "OPENAI_API_KEY=test_openai_key" >> .env
          echo "OPENAI_EMBEDDING_MODEL=text-embedding-3-small" >> .env
          echo "OPENAI_CHAT_MODEL=gpt-4-turbo-preview" >> .env
          echo "OPENAI_MAX_TOKENS=4096" >> .env
          echo "JWT_SECRET_KEY=test_jwt_secret_key" >> .env
          echo "JWT_ALGORITHM=HS256" >> .env
          echo "JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15" >> .env
          echo "JWT_REFRESH_TOKEN_EXPIRE_DAYS=7" >> .env
          echo "TOKEN_ENCRYPTION_KEY=test_token_encryption_key_must_be_32_bytes_len" >> .env
          echo "CORS_ORIGINS=[\"http://localhost:3000\",\"http://localhost:5173\"]" >> .env
          echo "CORS_ALLOW_CREDENTIALS=True" >> .env
          echo "RATE_LIMIT_PER_MINUTE=100" >> .env
          echo "CHUNK_SIZE=700" >> .env
          echo "CHUNK_OVERLAP=120" >> .env
          echo "TOP_K_CHUNKS=6" >> .env
          echo "EMBEDDING_DIMENSIONS=1536" >> .env
          echo "SUPPORTED_FILE_EXTENSIONS=.py,.js,.ts,.tsx,.jsx,.java,.go,.rs,.rb,.md,.json,.yaml,.yml" >> .env
          echo "IGNORED_DIRECTORIES=node_modules,.git,dist,build,venv,.venv,__pycache__,.pytest_cache" >> .env
          echo "MAX_FILE_SIZE_MB=10" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          echo "LOG_FORMAT=json" >> .env
          echo "ENABLE_METRICS=True" >> .env
          echo "METRICS_PORT=9090" >> .env
          echo "REDIS_POOL_MIN_SIZE=10" >> .env
          echo "REDIS_POOL_MAX_SIZE=50" >> .env

      - name: Install dependencies
        working-directory: ./devintel-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        working-directory: ./devintel-backend
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pytest tests/ --cov=app --cov-report=term || echo "Some tests may require full environment"

  # ==========================================
  # Project Health Check
  # ==========================================
  health-check:
    name: Project Health
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Verify project structure
        run: |
          echo "✅ Checking project structure..."
          test -d devintel-backend && echo "✅ Backend directory exists" || echo "❌ Backend missing"
          test -d devintel-frontend && echo "✅ Frontend directory exists" || echo "❌ Frontend missing"
          test -f README.md && echo "✅ README exists" || echo "❌ README missing"
          test -f LICENSE && echo "✅ LICENSE exists" || echo "❌ LICENSE missing"
          test -f CONTRIBUTING.md && echo "✅ CONTRIBUTING.md exists" || echo "❌ CONTRIBUTING.md missing"

  # ==========================================
  # Security Scanning
  # ==========================================
  # ==========================================
  # Security Scanning
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Trivy on Backend Docker Config
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './devintel-backend'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
      
      - name: Setup Python for Security Check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Python Dependency Security Check
        working-directory: ./devintel-backend
        run: |
          pip install safety
          safety check --file requirements.txt || true
      
      - name: Setup Node for NPM Audit
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: NPM Security Audit
        working-directory: ./devintel-frontend
        run: |
          npm install
          npm audit --audit-level=moderate || true
