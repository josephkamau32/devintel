name: CI/CD Pipeline  

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # Frontend Build and Test
  # ==========================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./devintel-frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./devintel-frontend
        run: npm ci
      
      - name: Lint code
        working-directory: ./devintel-frontend
        run: npm run lint || echo "Linting issues found"
      
      - name: Setup environment variables
        working-directory: ./devintel-frontend
        run: |
          echo "VITE_API_URL=http://localhost:8000" > .env
      
      - name: Build Frontend
        working-directory: ./devintel-frontend
        run: npm run build
      
      - name: Run tests (if any)
        working-directory: ./devintel-frontend
        run: npm run test || echo "No tests configured yet"

  # ==========================================
  # Backend Validation
  # ==========================================
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Check backend directory exists
        run: |
          if [ ! -d "devintel-backend" ]; then
            echo "❌ Backend directory not found"
            exit 1
          fi
          echo "✅ Backend directory exists"
      
      - name: Check requirements.txt
        working-directory: ./devintel-backend
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "❌ requirements.txt not found"
            exit 1
          fi
          echo "✅ requirements.txt exists"
      
      - name: Install dependencies
        working-directory: ./devintel-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        working-directory: ./devintel-backend
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pytest tests/ --cov=app --cov-report=term || echo "Some tests may require full environment"

  # ==========================================
  # Project Health Check
  # ==========================================
  health-check:
    name: Project Health
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Verify project structure
        run: |
          echo "✅ Checking project structure..."
          test -d devintel-backend && echo "✅ Backend directory exists" || echo "❌ Backend missing"
          test -d devintel-frontend && echo "✅ Frontend directory exists" || echo "❌ Frontend missing"
          test -f README.md && echo "✅ README exists" || echo "❌ README missing"
          test -f LICENSE && echo "✅ LICENSE exists" || echo "❌ LICENSE missing"
          test -f CONTRIBUTING.md && echo "✅ CONTRIBUTING.md exists" || echo "❌ CONTRIBUTING.md missing"

  # ==========================================
  # Security Scanning
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Trivy on Backend Docker Config
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './devintel-backend'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
      
      - name: Setup Python for Security Check
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Python Dependency Security Check
        working-directory: ./devintel-backend
        run: |
          pip install safety
          safety check --file requirements.txt || true
      
      - name: Setup Node for NPM Audit
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: NPM Security Audit
        working-directory: ./devintel-frontend
        run: |
          npm install
          npm audit --audit-level=moderate || true
