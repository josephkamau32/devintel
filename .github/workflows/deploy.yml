name: Deploy to Production

# Trigger on pushes to main after CI passes, or manually via workflow_dispatch
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

# Prevent parallel deploys (wait for any in-progress deploy to finish)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # 1. Build frontend production bundle
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devintel-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'devintel-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Set production env
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env
          echo "VITE_APP_ENV=production" >> .env

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: devintel-frontend/dist/
          retention-days: 1

  # ──────────────────────────────────────────────
  # 2. Deploy to VPS via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: build-frontend
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        id: check-config
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::VPS deployment secrets (SSH_HOST, SSH_PRIVATE_KEY) are not configured."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Download frontend dist
        if: steps.check-config.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      # Copy the built frontend to the server
      - name: Upload frontend dist to server
        if: steps.check-config.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/"
          target: "/opt/devintel/devintel-frontend/dist/"
          strip_components: 1

      # SSH in and do the deploy
      - name: Deploy via SSH
        if: steps.check-config.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/devintel

            echo "📦 Pulling latest code..."
            git pull origin main

            # Ensure frontend dist is mirrored to /opt/devintel/dist if expected
            mkdir -p /opt/devintel/dist
            cp -r /opt/devintel/devintel-frontend/dist/* /opt/devintel/dist/ 2>/dev/null || true

            echo "🔨 Building and starting services..."
            docker compose -f docker-compose.prod.yml pull --quiet
            docker compose -f docker-compose.prod.yml up --build -d --remove-orphans

            echo "⏳ Waiting for backend to be healthy..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "✅ Backend is healthy"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "❌ Backend health check failed after 60s"
                docker compose -f docker-compose.prod.yml logs --tail=50 backend
                exit 1
              fi
              sleep 5
            done

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "🚀 Deploy complete!"

      - name: Report skipped VPS deployment
        if: steps.check-config.outputs.configured == 'false'
        run: |
          echo "ℹ️ VPS deployment is not configured (SSH_HOST / SSH_PRIVATE_KEY secrets not set)."
          echo "ℹ️ Production environment runs on Render (Backend) and Vercel (Frontend)."
          echo "ℹ️ Render auto-deploys from the GitHub main branch upon push."
          echo "ℹ️ This step is skipped gracefully and is not an error state."

      - name: Notify success
        if: success() && steps.check-config.outputs.configured == 'true'
        run: |
          echo "✅ VPS deployment completed successfully"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED"
          echo "Commit: ${{ github.sha }}"
          echo "Check logs above for details"
