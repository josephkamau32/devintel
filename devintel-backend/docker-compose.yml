version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devintel_postgres
    environment:
      POSTGRES_USER: devintel
      POSTGRES_PASSWORD: devintel
      POSTGRES_DB: devintel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devintel"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devintel-network

  redis:
    image: redis:7-alpine
    container_name: devintel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - devintel-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: devintel_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - devintel-network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: devintel_worker
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery worker --loglevel=info --concurrency=4
    networks:
      - devintel-network

  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: devintel_flower
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
      - worker
    command: celery -A app.tasks.celery flower --port=5555
    networks:
      - devintel-network

volumes:
  postgres_data:
  redis_data:

networks:
  devintel-network:
    driver: bridge
