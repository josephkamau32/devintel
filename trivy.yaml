# Trivy configuration for the CI security scan
# https://aquasecurity.github.io/trivy/latest/docs/references/configuration/config-file/

# Output and exit
format: table
exit-code: 1

# Only report CRITICAL and HIGH
severity:
  - CRITICAL
  - HIGH

# Skip CVEs with no released patch (python-jose, ecdsa)
vulnerability:
  ignore-unfixed: true

# Skip CVEs that require semver-major bumps we cannot safely do
# (vite 5→6, vitest 1→3, transitive deps of mermaid, etc.)
ignorefile: .trivyignore
